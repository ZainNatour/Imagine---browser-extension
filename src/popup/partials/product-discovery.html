<div id="product-discovery" class="tab-content">
  <div class="product-image-section">
    <img
      src="/src/assets/images/stores/adidas.jpg"
      alt="Product Image"
      class="product-image"
    />
    <button class="wishlist-btn btn btn-rounded">❤️</button>
  </div>

  <div class="product-info">
    <h3 class="product-name">Classic T-Shirt</h3>
    <p class="product-price">$29.99</p>
    <p class="product-clothing-type">Clothing Type: T-Shirts</p>
  </div>
  <p class="product-placeholder" style="display: none">No product detected on this page.</p>

  <div class="try-on-button">
    <button class="btn btn-primary btn-rounded">Try On</button>
  </div>

  <div class="product-colors-section">
    <h4>Colors</h4>
    <div class="color-grid">
      <button class="scroll-btn left-btn btn btn-primary btn-rounded">←</button>
      <div class="color-swatch-grid">
        <div class="color-swatch" style="background-color: #000"></div>
        <div class="color-swatch" style="background-color: #fff"></div>
        <div class="color-swatch" style="background-color: #f00"></div>
        <div class="color-swatch" style="background-color: #0f0"></div>
      </div>
      <button class="scroll-btn right-btn btn btn-primary btn-rounded">→</button>
    </div>
  </div>
</div>

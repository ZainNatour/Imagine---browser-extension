<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Imagine Side Panel</title>
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/general.css" />
    <link rel="stylesheet" href="styles/search-filter.css" />
    <link rel="stylesheet" href="styles/store-grid.css" />
    <link rel="stylesheet" href="styles/product-discovery.css" />
    <link rel="stylesheet" href="styles/dressing-room.css" />
    <link rel="stylesheet" href="styles/misc.css" />
    <link rel="stylesheet" href="styles/wishlist.css" />
    <link rel="stylesheet" href="styles/tabs.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
    />
  </head>
  <body class="theme-light">
    <div class="container">
      <h1>Imagine Assistant</h1>
      <div class="tabs">
        <button class="tab-button active" id="store-discovery-tab">
          <i class="fas fa-store"></i>
        </button>
        <button class="tab-button" id="product-discovery-tab">
          <i class="fas fa-box-open"></i>
        </button>
        <button class="tab-button" id="dressing-room-tab">
          <i class="fas fa-tshirt"></i>
        </button>
          <button class="tab-button" id="wishlist-tab">
            <i class="fas fa-heart"></i>
          </button>
          <button class="tab-button" id="home-tab">
            <i class="fas fa-home"></i>
          </button>
          <button class="tab-button" id="options-button">
            <i class="fas fa-cog"></i>
          </button>
        </div>

      <div id="tab-content">
        <!-- Store Discovery Tab Content -->
        <div id="store-discovery" class="tab-content active">
          <div class="search-filter-container">
            <input type="text" id="search-bar" placeholder="Search stores..." />
            <button id="filter-button" class="btn btn-primary btn-rounded">
              <img src="/src/assets/icons/filter.jpg" alt="Filter" />
            </button>
          </div>

          <!-- Filter Section -->
          <div id="filter-section" class="filter-section" style="display: none">
            <!-- Filter options will be dynamically inserted here -->
          </div>

          <!-- Store Grid -->
          <div id="store-grid" class="store-grid">
            <!-- Store items will be dynamically loaded here -->
          </div>

          <button id="load-more" class="btn btn-primary btn-rounded">Load More</button>
        </div>

        <!-- Product Discovery Tab Content -->
        <div id="product-discovery" class="tab-content">
          <!-- Product Image Section with Wishlist Button Overlay -->
          <div class="product-image-section">
            <img alt="Product Image" class="product-image" />
            <button class="wishlist-btn btn btn-rounded">
              <i class="fas fa-heart"></i>
            </button>
          </div>

          <!-- Product Information Section -->
          <div class="product-info">
            <h3 class="product-name"></h3>
            <p class="product-price"></p>
            <p class="product-clothing-type"></p>
          </div>
          <p class="product-placeholder" style="display: none">No product detected on this page.</p>

          <!-- Try On Button (Centered) -->
          <div class="try-on-button">
            <button class="btn btn-primary btn-rounded">Add to dressing room</button>
          </div>

          <!-- Product Colors Section (Larger Swatches) -->
          <div class="product-colors-section" style="display: none">
            <h4>Colors</h4>
            <div class="color-grid"></div>
          </div>

          <!-- Product Details Section -->
          <div class="collapsible-section" style="display: none">
            <div class="collapsible-header">
              <span>Product Details</span>
              <span class="arrow">›</span>
            </div>
            <div class="collapsible-content"></div>
          </div>

          <!-- Ratings and Reviews -->
          <div class="collapsible-section" style="display: none">
            <div class="collapsible-header">
              <span>Ratings & Reviews</span>
              <span class="arrow">›</span>
            </div>
            <div class="collapsible-content"></div>
          </div>

          <!-- Similar Products Section (Improved Layout) -->
          <div class="similar-products-section" style="display: none">
            <h4>Similar Products</h4>
            <div class="similar-products-grid"></div>
          </div>
        </div>

        <!-- Dressing Room Tab Content -->
        <div id="dressing-room" class="tab-content">
          <div class="upload-section">
            <div class="upload-frame" id="upload-trigger">
              <img src="/src/assets/icons/filter.jpg" alt="Upload Icon" />
              <p>Upload Your Image</p>
            </div>
            <input type="file" id="photo-input" accept="image/*" style="display: none" />
          </div>
        
          <div class="photo-gallery-section">
            <h3>Your Photos</h3>
            <div id="photo-gallery" class="photo-gallery"></div>
          </div>
        
          <div class="model-grid-section">
            <h3>Models</h3>
            <div class="model-grid">
              <button class="scroll-btn left-btn btn btn-primary btn-rounded">←</button>
              <div class="model-swatch-grid">
                <!-- Model swatches will be dynamically loaded here -->
              </div>
              <button class="scroll-btn right-btn btn btn-primary btn-rounded">→</button>
            </div>
          </div>
        
          <div class="avatar-section" style="display: none">
            <h3>Personalized Avatar</h3>
            <div class="avatar-inputs">
              <label for="height">Height:</label>
              <input type="text" id="height" placeholder="e.g., 5'9" />
              <label for="weight">Weight:</label>
              <input type="text" id="weight" placeholder="e.g., 160 lbs" />
              <label for="body-shape">Body Shape:</label>
              <input type="text" id="body-shape" placeholder="e.g., Athletic" />
              <label for="skin-tone">Skin Tone:</label>
              <input type="text" id="skin-tone" placeholder="e.g., Fair" />
            </div>
          </div>
        </div>
        <!-- Home Tab Content -->
        <div id="home" class="tab-content">
          <p>Welcome to the home tab.</p>
        </div>

        <!-- Wishlist Tab Content -->
        <div id="wishlist" class="tab-content">
          <button class="centralized-wishlist-btn btn btn-primary btn-rounded">Go to Centralized Wishlist</button>
          <h3>Your Wishlist</h3>
          <div id="wishlist-grid" class="wishlist-grid"></div>
        </div>
      </div>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
